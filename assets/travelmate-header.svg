<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0F1D"/>
      <stop offset="40%" stop-color="#101D42"/>
      <stop offset="80%" stop-color="#1A2758"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <linearGradient id="purple-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7956F5"/>
      <stop offset="50%" stop-color="#3478F6"/>
      <stop offset="100%" stop-color="#16BFA5"/>
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#FF9900"/>
    </linearGradient>

    <linearGradient id="glow-circle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7956F5" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#3478F6" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="purple-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" rx="24" fill="url(#bg-grad)"/>

  <!-- Decorative Ambient Glow Circles -->
  <circle cx="150" cy="100" r="180" fill="url(#glow-circle)"/>
  <circle cx="1050" cy="300" r="220" fill="url(#glow-circle)"/>
  <circle cx="600" cy="40" r="140" fill="#16BFA5" fill-opacity="0.08"/>

  <!-- Flight Path Curve (Curved Dash Line) -->
  <path d="M 80 340 Q 300 120 600 210 T 1120 100" fill="none" stroke="url(#purple-blue)" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.6"/>

  <!-- Floating Waypoint Icons -->
  <circle cx="280" cy="180" r="5" fill="#3478F6" opacity="0.8"/>
  <circle cx="600" cy="210" r="6" fill="#16BFA5" opacity="0.9"/>
  <circle cx="920" cy="130" r="5" fill="#7956F5" opacity="0.8"/>

  <!-- Top Badge: Team Innovation 27X7 -->
  <g transform="translate(60, 48)">
    <rect width="260" height="34" rx="17" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15"/>
    <circle cx="20" cy="17" r="4.5" fill="#16BFA5" filter="url(#purple-glow)"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="800" fill="#38BDF8" letter-spacing="1.5">TEAM INNOVATION 27X7</text>
  </g>

  <!-- Top Right Live Status Pill -->
  <g transform="translate(930, 48)">
    <rect width="210" height="34" rx="17" fill="#16BFA5" fill-opacity="0.12" stroke="#16BFA5" stroke-opacity="0.35"/>
    <circle cx="20" cy="17" r="4" fill="#16BFA5"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#16BFA5">13 AI AGENTS ONLINE</text>
  </g>

  <!-- Main Center Brand Logo & Title -->
  <g transform="translate(60, 120)">
    
    <!-- Logo Icon Box -->
    <g transform="translate(0, 5)">
      <rect width="72" height="72" rx="22" fill="url(#purple-blue)" filter="url(#shadow)"/>
      <path d="M 22 46 L 50 18 M 50 18 L 36 18 M 50 18 L 50 32 M 22 46 L 28 34 L 38 44 Z" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Main Title -->
    <text x="92" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', Inter, sans-serif" font-size="46" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">
      TravelMate<tspan fill="#7956F5">.AI</tspan>
    </text>

    <!-- Subtitle / Mission -->
    <text x="95" y="78" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="16" font-weight="600" fill="#94A3B8" letter-spacing="0.5">
      Your Intelligent Virtual Travel Agent &amp; Autonomous Copilot
    </text>

    <text x="95" y="104" font-family="-apple-system, BlinkMacSystemFont, Inter, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">
      Autonomous Multi-Agent Itineraries • Real-Time Amadeus GDS Airfares • IATA Visa Verification • 24/7 SOS
    </text>
  </g>

  <!-- Feature Highlights Pill Grid -->
  <g transform="translate(60, 270)">
    
    <!-- Pill 1: Web & Mobile -->
    <g transform="translate(0, 0)">
      <rect width="250" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">📱 React Native + 🖥️ Web</text>
    </g>

    <!-- Pill 2: 13 Autonomous Agents -->
    <g transform="translate(266, 0)">
      <rect width="250" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🤖 13 Autonomous Agents</text>
    </g>

    <!-- Pill 3: Indian & Global Destinations -->
    <g transform="translate(532, 0)">
      <rect width="260" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🇮🇳 37+ Domestic &amp; Global Hubs</text>
    </g>

    <!-- Pill 4: Mobility & Rentals -->
    <g transform="translate(808, 0)">
      <rect width="250" height="42" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12"/>
      <text x="20" y="26" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">🚕 Outstation Cabs &amp; Bikes</text>
    </g>
  </g>

  <!-- Bottom Tech Stack Badges -->
  <g transform="translate(60, 345)">
    <text x="0" y="24" font-family="sans-serif" font-size="11.5" font-weight="800" fill="#64748B" letter-spacing="1.5">CORE ARCHITECTURE:</text>
    
    <g transform="translate(170, 6)">
      <rect width="80" height="26" rx="8" fill="#7956F5" fill-opacity="0.2" stroke="#7956F5" stroke-opacity="0.4"/>
      <text x="14" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#A78BFA">FastAPI</text>
    </g>

    <g transform="translate(260, 6)">
      <rect width="90" height="26" rx="8" fill="#3478F6" fill-opacity="0.2" stroke="#3478F6" stroke-opacity="0.4"/>
      <text x="14" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#60A5FA">React 19</text>
    </g>

    <g transform="translate(360, 6)">
      <rect width="105" height="26" rx="8" fill="#16BFA5" fill-opacity="0.2" stroke="#16BFA5" stroke-opacity="0.4"/>
      <text x="14" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#2DD4BF">TypeScript</text>
    </g>

    <g transform="translate(475, 6)">
      <rect width="80" height="26" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.2"/>
      <text x="14" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Expo 52</text>
    </g>

    <g transform="translate(565, 6)">
      <rect width="105" height="26" rx="8" fill="#38BDF8" fill-opacity="0.2" stroke="#38BDF8" stroke-opacity="0.4"/>
      <text x="14" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#38BDF8">Tailwind v4</text>
    </g>

    <g transform="translate(680, 6)">
      <rect width="115" height="26" rx="8" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B" stroke-opacity="0.4"/>
      <text x="14" y="17" font-family="sans-serif" font-size="11" font-weight="700" fill="#FBBF24">Amadeus GDS</text>
    </g>
  </g>

</svg>
